# Real training. Sized for M4/MPS; revisit after scripts/benchmark_mps.py (M0 gate).
name: full
seed: 17
data:
  root: data/DIV2K
  severity: moderate
  val_pairs: 256
  max_train_images: 0          # all 750
tools:
  epochs: 40                   # safety CAP only - early stopping is the judge (paper: fixed 80)
  steps_per_epoch: 4000        # paper: 3.2e5 iters / 80 epochs
  batch_size: 64
  lr: 0.1
  lr_drop_every: 5             # paper: every 20 of 80 -> scaled 1/4
  lr_drop_factor: 0.1
  momentum: 0.9
  weight_decay: 0.0001
  grad_clip_norm: 0.4          # VDSR-style clipping
  robust_extras: true          # paper Sec 3.1 "+Noise" trick (assumed magnitudes)
  optimizer: sgd
# infra_spec §3-§4 full agent config (fidelity_spec §4 numbers)
agent:
  env_steps: 2000000
  warmup_steps: 5000
  replay_capacity: 500000
  batch_episodes: 32
  train_every: 4
  target_sync_every: 10000
  chunk_size: 25000
  eval_pairs: 256
  epsilon_end: 0.1
  epsilon_anneal_steps: 1000000
  lr: 1.0e-4
  gamma: 0.99
  use_double_dqn: true  # F1 applied: smoke run showed single-tool Q inflation (vanilla available for ablation)
  grad_clip_norm: 5.0  # F5 applied 2026-06-12: grad_norm_ema grew 0.56->44 by 550k steps unclipped (null = paper-faithful ablation)
