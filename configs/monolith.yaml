# Monolithic-CNN baseline (P3.E4 / B5). Spec: docs/plan3/monolith_spec.md —
# every number is from the 3-panel synthesis. Trained on Colab (RLR_DEVICE=cuda);
# CPU/MPS-safe for smoke. Single end-to-end DnCNN-style CNN, capacity matched to
# the 12-tool toolbox (448,195 params = 102.8% of 436,068).
name: monolith
seed: 17
data:
  root: data/DIV2K
  severity: moderate           # unused by the monolith (trains on all severities); required by DataCfg
  val_pairs: 256
  max_train_images: 0          # all 750 (DIV2K 1-750 train, 801-900 val, 751-800 TEST held out)
# tools block copied from full.yaml so load_config stays happy (the monolith
# baseline ignores it — it trains no tools).
tools:
  epochs: 40
  steps_per_epoch: 4000
  batch_size: 64
  lr: 0.1
  lr_drop_every: 5
  lr_drop_factor: 0.1
  momentum: 0.9
  weight_decay: 0.0001
  grad_clip_norm: 0.4
  robust_extras: true
  optimizer: sgd
# docs/plan3/monolith_spec.md decision log
monolith:
  loss: charbonnier            # sqrt((pred-clean)^2 + eps^2).mean(); 'mse' selectable
  eps: 1.0e-3
  optimizer: adam              # repo divergence-safe default; SGD-0.1 is wrong for a deeper net
  lr: 2.0e-4
  lr_drop_every: 8             # step x0.5 every 8 epochs (floor ~2.5e-5)
  lr_drop_factor: 0.5
  weight_decay: 1.0e-4
  grad_clip_norm: 0.5
  batch_size: 64
  steps_per_epoch: 8000
  epochs: 60                   # safety CAP only — early stopping (patience+MIN_IMPROVEMENT_DB) is the judge
  patience: 6
  severities: [mild, moderate, severe]   # UNIFORM 1/3-1/3-1/3 (matches the toolbox's collective training exposure)
  robust_extras: false         # input recipe already injects noise+JPEG; keeps train/eval parity
  val_pairs: 256               # fixed val set, DIV2K 801-900, seed+10000
  depth: 14
  width: 64
